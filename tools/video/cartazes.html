<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartazes do vídeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Cartazes do vídeo MedBot. Abrir como cartazes.html#c1 (abertura) ou #c2 (encerramento). */
  :root { --noite: #0f172a; --noite2: #16213d; --azul: #3b82f6; --ceu: #93c5fd; --claro: #f8fafc; --suave: #94a3b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--noite); color: var(--claro); font-family: Inter, Arial, sans-serif; }
  .cartaz { display: none; position: fixed; inset: 0; padding: 84px 110px 170px;
    background: radial-gradient(1100px 620px at 82% 18%, #1e3a8a55, transparent 70%), linear-gradient(160deg, var(--noite), var(--noite2)); }
  .cartaz.on { display: flex; }
  .marca { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 26px; color: var(--ceu); }
  .faixa { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, var(--azul), var(--ceu)); }

  /* abertura */
  #c1 { align-items: center; gap: 72px; }
  #c1 .texto { flex: 1.2; }
  #c1 h1 { font-size: 104px; line-height: 1; margin: 30px 0 22px; letter-spacing: -3px; font-weight: 800; }
  #c1 .sub { font-size: 38px; color: var(--suave); font-weight: 500; line-height: 1.3; max-width: 760px; }
  #c1 .balao { flex: 1; max-width: 520px; display: flex; flex-direction: column; gap: 18px; }
  #c1 .msg { padding: 20px 26px; border-radius: 22px; font-size: 26px; line-height: 1.35; max-width: 88%; }
  #c1 .msg.bot { background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 6px; align-self: flex-start; }
  #c1 .msg.eu { background: var(--azul); border-bottom-right-radius: 6px; align-self: flex-end; }
  #c1.on .msg { animation: sobe .6s ease-out both; }
  #c1.on .msg:nth-child(1) { animation-delay: 1.2s; }
  #c1.on .msg:nth-child(2) { animation-delay: 4.2s; }
  #c1.on .msg:nth-child(3) { animation-delay: 7.2s; }
  @keyframes sobe { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

  /* encerramento */
  #c2 { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #c2 .nome { font-size: 112px; font-weight: 800; letter-spacing: -3px; margin: 30px 0 14px; }
  #c2 .linha { font-size: 36px; color: var(--suave); max-width: 1100px; line-height: 1.35; }
</style>
</head>
<body>
<template id="logo">
  <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lgM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="11" fill="url(#lgM)"/><path d="M20 12h8v8h8v8h-8v8h-8v-8h-8v-8h8z" fill="#fff"/></svg>
</template>

<section class="cartaz" id="c1">
  <div class="texto">
    <div class="marca"><i data-logo="48"></i> Agendamento com inteligência artificial</div>
    <h1>MedBot</h1>
    <div class="sub">A sua agenda atendendo sozinha, 24 horas por dia.</div>
  </div>
  <div class="balao">
    <div class="msg eu">Preciso marcar uma consulta</div>
    <div class="msg bot">Claro! Me conte o que você está sentindo.</div>
    <div class="msg bot">Encontrei três horários para amanhã.</div>
  </div>
  <div class="faixa"></div>
</section>

<section class="cartaz" id="c2">
  <i data-logo="120"></i>
  <div class="nome">MedBot</div>
  <div class="linha">Sua agenda cheia, sua equipe livre para cuidar de quem já chegou.</div>
  <div class="faixa"></div>
</section>

<script>
  const logo = document.getElementById('logo').innerHTML
  let k = 0
  for (const i of document.querySelectorAll('[data-logo]')) {
    const t = i.dataset.logo
    k++
    // id do gradiente único por cópia (gradiente dentro de seção oculta não pinta no Chrome)
    i.outerHTML = logo.replace('<svg ', `<svg width="${t}" height="${t}" `).replaceAll('lgM', 'lgM' + k)
  }
  const mostrar = () => {
    const id = (location.hash || '#c1').slice(1)
    for (const s of document.querySelectorAll('.cartaz')) s.classList.toggle('on', s.id === id)
  }
  addEventListener('hashchange', mostrar)
  mostrar()
</script>
</body>
</html>
