<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Tela de encerramento da sala de vídeo do MedBot (T157). Substitui as páginas close*.html do Jitsi. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Chamada encerrada | MedBot Teleconsulta</title>
    <link rel="icon" href="../images/favicon.svg?v=medbot1">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e2e8f0;
            background: #0f172a;
        }
        main { width: 100%; max-width: 440px; text-align: center; }
        .logo { display: block; width: 132px; height: auto; margin: 0 auto 32px; }
        h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.3; color: #ffffff; }
        p { margin: 0 0 12px; font-size: 1rem; line-height: 1.55; color: #cbd5e1; }
        .acoes { margin-top: 28px; }
        button {
            min-height: 48px;
            padding: 12px 28px;
            font: inherit;
            font-weight: 600;
            color: #ffffff;
            background: #2563eb;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:active { background: #1e40af; }
        button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
        .nota { margin-top: 28px; font-size: 0.875rem; color: #94a3b8; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="../images/medbot-logo.svg" alt="MedBot">
        <h1>Você saiu da chamada</h1>
        <p>Se saiu sem querer, volte agora: a sala continua aberta.</p>
        <p>Se a consulta já terminou, não é preciso fazer mais nada.</p>

        <div class="acoes" id="acoes" hidden>
            <button type="button" id="voltar">Voltar para a chamada</button>
        </div>
        <p class="nota" id="sem-volta" hidden>Para voltar, abra de novo o link que você recebeu.</p>
    </main>

    <script>
        // O Jitsi traz para cá quem sai da chamada. Antes disso guarda, nesta aba, o acesso assinado (jwt)
        // da sala; o endereço da sala vem da página anterior. Com os dois, dá para entrar de novo.
        (function () {
            var sala = null;
            try {
                var anterior = new URL(document.referrer);
                if (anterior.origin === location.origin && !/^\/static\//.test(anterior.pathname) && anterior.pathname.length > 1) {
                    sala = anterior.pathname;
                }
            } catch (e) { /* sem página anterior */ }

            var acesso = '';
            try { acesso = window.sessionStorage.getItem('jwt') || ''; } catch (e) { /* armazenamento bloqueado */ }

            if (!sala) {
                document.getElementById('sem-volta').hidden = false;
                return;
            }
            var destino = sala + (acesso ? '?jwt=' + encodeURIComponent(acesso) : '');
            document.getElementById('acoes').hidden = false;
            document.getElementById('voltar').addEventListener('click', function () {
                location.href = destino;
            });
        })();
    </script>
</body>
</html>
