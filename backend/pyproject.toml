[project]
name = "medbot-api"
version = "0.1.0"
description = "MedBot - Sistema de Agendamento Medico com IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "qdrant-client>=1.0.0",
    "redis[asyncio]>=5.0.0",
    "celery[redis]>=5.3.0",
    "structlog>=24.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "twilio>=8.0.0",
    "langchain-ollama>=1.0.1",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
